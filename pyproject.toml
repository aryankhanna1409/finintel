[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finintel"
version = "0.1.0"
description = "Financial Intelligence & RAG system: SEC/13F/Form 4 ingestion, hybrid retrieval, GraphRAG cross-company inference and a prescriptive CFO advisory engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "networkx>=3.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
embeddings = ["sentence-transformers>=3.0"]
neo4j = ["neo4j>=5.20"]
all = ["anthropic>=1.0", "sentence-transformers>=3.0", "neo4j>=5.20"]
dev = ["pytest>=8"]

[project.scripts]
finintel = "finintel.cli:main"

[tool.setuptools.packages.find]
include = ["finintel*"]

[tool.setuptools.package-data]
finintel = ["data/fixtures/*.json", "data/fixtures/filings/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
